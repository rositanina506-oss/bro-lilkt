<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b16">
  <title>404 // SIGNAL LOST</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b16;
      --cyan: #41f7ff;
      --pink: #ff2f92;
      --yellow: #f9eb71;
      --text: #ecf5ff;
      --muted: #8496ad;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background: radial-gradient(ellipse at 50% 38%, #162044 0%, var(--bg) 56%, #03050a 100%);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      isolation: isolate;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image: linear-gradient(#41f7ff0b 1px, transparent 1px), linear-gradient(90deg, #41f7ff0b 1px, transparent 1px);
      background-size: 48px 48px;
      transform: perspective(400px) rotateX(58deg) scale(2.2) translateY(11%);
      transform-origin: bottom;
      mask-image: linear-gradient(transparent 4%, #000 90%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: repeating-linear-gradient(transparent 0 3px, #00000030 4px 5px);
      opacity: .38;
    }
    .aura {
      position: fixed;
      width: 42vw;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .18;
      z-index: -1;
      pointer-events: none;
    }
    .aura.left { top: -18%; left: -15%; background: var(--pink); }
    .aura.right { right: -15%; bottom: -30%; background: var(--cyan); }
    .shell {
      position: relative;
      width: min(820px, calc(100% - 36px));
      margin: 35px 0;
      padding: clamp(28px, 7vw, 70px) clamp(22px, 7vw, 78px);
      text-align: center;
      background: linear-gradient(145deg, #0d1426e8, #0a1020da);
      border: 1px solid #41f7ff70;
      clip-path: polygon(0 0, calc(100% - 32px) 0, 100% 32px, 100% 100%, 32px 100%, 0 calc(100% - 32px));
      box-shadow: 0 0 70px #41f7ff12, inset 0 0 38px #41f7ff0a;
    }
    .shell::before, .shell::after {
      content: '';
      position: absolute;
      height: 3px;
      width: 110px;
      background: var(--pink);
      box-shadow: 0 0 18px var(--pink);
    }
    .shell::before { top: 0; left: 0; }
    .shell::after { right: 0; bottom: 0; background: var(--cyan); box-shadow: 0 0 18px var(--cyan); }
    .topline, .bottomline { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; font-size: 10px; letter-spacing: .2em; color: var(--cyan); }
    .topline .status { color: var(--pink); }
    .status-dot { display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 12px var(--pink); animation: blink 1.6s step-end infinite; }
    .eyebrow { margin: 46px 0 0; color: var(--yellow); font-size: 12px; font-weight: bold; letter-spacing: .42em; text-transform: uppercase; }
    h1 {
      position: relative;
      display: inline-block;
      margin: 2px 0 0;
      color: var(--text);
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: clamp(116px, 24vw, 220px);
      line-height: 1.05;
      letter-spacing: .045em;
      text-shadow: -5px 0 var(--cyan), 5px 0 var(--pink), 0 0 45px #41f7ff25;
    }
    h1::before, h1::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    h1::before { color: var(--cyan); text-shadow: -4px 0 var(--pink); clip-path: inset(15% 0 65% 0); animation: glitch-one 3.6s infinite linear alternate-reverse; }
    h1::after { color: var(--pink); text-shadow: 4px 0 var(--cyan); clip-path: inset(70% 0 10% 0); animation: glitch-two 2.8s infinite linear alternate-reverse; }
    .title { margin: 4px 0 16px; font-size: clamp(19px, 4vw, 30px); font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
    .title span { color: var(--pink); }
    .subtitle { max-width: 510px; margin: 0 auto; color: var(--muted); font-family: Arial, sans-serif; font-size: 15px; line-height: 1.8; }
    .divider { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 28px 0; color: var(--yellow); font-size: 11px; letter-spacing: .12em; }
    .divider::before, .divider::after { content: ''; width: min(120px, 22%); height: 1px; background: linear-gradient(90deg, transparent, var(--cyan)); }
    .divider::after { transform: rotate(180deg); }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      min-width: 188px;
      min-height: 50px;
      padding: 13px 20px;
      border: 1px solid var(--cyan);
      color: #061118;
      background: var(--cyan);
      font: bold 12px 'Courier New', monospace;
      letter-spacing: .1em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, background .2s, color .2s;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 0 26px #41f7ff65; }
    .btn:focus-visible { outline: 2px solid var(--yellow); outline-offset: 5px; }
    .btn.outline { color: var(--pink); background: transparent; border-color: var(--pink); }
    .btn.outline:hover { background: #ff2f9215; box-shadow: 0 0 24px #ff2f9255; }
    .bottomline { margin-top: 53px; padding-top: 16px; border-top: 1px solid #41f7ff25; color: #7686a2; letter-spacing: .12em; }
    .bottomline strong { color: var(--cyan); font-weight: normal; }
    @keyframes blink { 50% { opacity: .1; } }
    @keyframes glitch-one {
      0%, 84%, 100% { transform: translate(0); }
      85% { transform: translate(-9px, 2px); }
      87% { transform: translate(6px, -2px); }
      90% { transform: translate(-3px, 0); }
    }
    @keyframes glitch-two {
      0%, 77%, 100% { transform: translate(0); }
      78% { transform: translate(7px, -3px); }
      81% { transform: translate(-8px, 2px); }
      83% { transform: translate(2px, 0); }
    }
    @media (max-width: 520px) {
      .topline, .bottomline { font-size: 9px; letter-spacing: .06em; }
      .eyebrow { margin-top: 34px; font-size: 10px; letter-spacing: .25em; }
      .subtitle { font-size: 14px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
      .bottomline { margin-top: 39px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="aura left" aria-hidden="true"></div>
  <div class="aura right" aria-hidden="true"></div>
  <main class="shell">
    <div class="topline"><span>SYS://ERROR_PAGE</span><span class="status"><span class="status-dot" aria-hidden="true"></span>CONNECTION LOST</span></div>
    <p class="eyebrow">Access Denied // File Missing</p>
    <h1 data-text="404">404</h1>
    <h2 class="title">PAGE <span>NOT FOUND</span></h2>
    <p class="subtitle">Sinyal terputus. Halaman yang kamu cari tidak ditemukan, sudah dipindahkan, atau tidak lagi tersedia di jaringan.</p>
    <div class="divider" aria-hidden="true">[ ERROR CODE: 404 ]</div>
    <div class="actions">
      <a href="/" class="btn"><span aria-hidden="true">⌂</span> Kembali ke Beranda</a>
      <button type="button" class="btn outline" onclick="if (history.length > 1) { history.back(); } else { location.href = '/'; }"><span aria-hidden="true">↶</span> Halaman Sebelumnya</button>
    </div>
    <div class="bottomline"><span>NEURAL NETWORK // OFFLINE</span><span>STATUS: <strong>404_NOT_FOUND</strong></span></div>
  </main>
</body>
</html>
